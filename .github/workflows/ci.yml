name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'copilot/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techops_hub
          POSTGRES_USER: techops_hub
          POSTGRES_PASSWORD: techops_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techops_hub -d techops_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      APP_ORIGIN: http://localhost:5173
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: techops_hub
      DATABASE_USER: techops_hub
      DATABASE_PASSWORD: techops_hub
      DATABASE_SSL: false
      DATABASE_SSL_REJECT_UNAUTHORIZED: true
      AUTH_PROVIDER: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run migration:run

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
